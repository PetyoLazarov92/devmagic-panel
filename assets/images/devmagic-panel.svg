<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">DevMagic Panel - local WordPress control panel</title>
  <desc id="desc">Animated banner: the panel in a browser window at https://local.devmagic, local sites appearing one by one, a new site installing, and badges for local SSL, Apache and hosts, WordPress installs, light and dark themes, undo and Claude. Balanced for light and dark themes.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#5ac8fa"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(20,16,60,0.16)"/>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.16)"/>
    </filter>

    <clipPath id="window">
      <rect width="480" height="300" rx="20"/>
    </clipPath>

    <g id="spark">
      <polygon points="0,-9 3,-3 9,0 3,3 0,9 -3,3 -9,0 -3,-3"/>
    </g>

    <!-- A padlock, 10 wide and 12 high, from its top left. -->
    <g id="lock">
      <path d="M2.5 5 V3.5 a2.5 2.5 0 0 1 5 0 V5" fill="none" stroke="#22a55e" stroke-width="1.6"/>
      <rect x="0.5" y="5" width="9" height="7" rx="1.6" fill="#22a55e"/>
    </g>

    <style><![CDATA[
      :root {
        --text-main: #14123a;
        --text-sub: #4f5672;
        --card: #ffffff;
        --card-border: #e3e3f1;
        --chrome: #f4f3fb;
        --side: #f7f6fd;
        --row: #ffffff;
        --pill: #ffffff;
        --track: #e7e5f6;
        --nav: #d9d6ee;
        --badge-bg: #f6f5fd;
        --badge-border: #e1def3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text-main: #eceaff;
          --text-sub: #a6a9c4;
          --card: #1c1b2b;
          --card-border: #2e2c44;
          --chrome: #232236;
          --side: #19182a;
          --row: #232236;
          --pill: #19182a;
          --track: #34324d;
          --nav: #3a3856;
          --badge-bg: #1f1e30;
          --badge-border: #322f4b;
        }
      }

      text { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace; }

      .fadeUp { opacity: 0; animation: fadeUp 1.1s ease forwards; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* The site rows come in one by one, stay, and start over. */
      .row { opacity: 0; animation: rowIn 9s ease-in-out infinite both; }
      .row2 { animation-delay: 0.5s; }
      .row3 { animation-delay: 1s; }
      @keyframes rowIn {
        0% { opacity: 0; transform: translateX(-10px); }
        8%, 88% { opacity: 1; transform: translateX(0); }
        96%, 100% { opacity: 0; transform: translateX(0); }
      }

      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* The new install's progress, from nothing to done, in time with the rows. */
      .fill { transform-box: fill-box; transform-origin: left center; animation: fill 9s ease-in-out 1s infinite both; }
      @keyframes fill {
        0%, 10% { transform: scaleX(0); }
        75%, 100% { transform: scaleX(1); }
      }
      .installing { animation: swap 9s linear 1s infinite both; }
      .installed { opacity: 0; animation: swapBack 9s linear 1s infinite both; }
      @keyframes swap { 0%, 74% { opacity: 1; } 76%, 100% { opacity: 0; } }
      @keyframes swapBack { 0%, 74% { opacity: 0; } 76%, 100% { opacity: 1; } }

      /* The pointer goes to New site and clicks it. */
      .pointer { animation: pointer 9s ease-in-out infinite; }
      @keyframes pointer {
        0%, 10% { transform: translate(250px, 250px); }
        30%, 45% { transform: translate(410px, 74px); }
        70%, 100% { transform: translate(250px, 250px); }
      }
      .click { opacity: 0; transform-box: fill-box; transform-origin: center; animation: click 9s ease-out infinite; }
      @keyframes click {
        0%, 31% { opacity: 0; transform: scale(0.4); }
        33% { opacity: 0.9; transform: scale(0.6); }
        42%, 100% { opacity: 0; transform: scale(1.6); }
      }

      .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; animation: sparkle 4s linear infinite; }
      @keyframes sparkle {
        0% { opacity: 0; transform: scale(0.4) rotate(0deg); }
        10% { opacity: 1; transform: scale(1.15) rotate(15deg); }
        50% { opacity: 0.8; transform: scale(1) rotate(30deg); }
        100% { opacity: 0; transform: scale(0.4) rotate(45deg); }
      }

      .badge { font-size: 15px; font-weight: 500; fill: var(--text-main); }
      .badge-bg { fill: var(--badge-bg); stroke: var(--badge-border); }

      @media (prefers-reduced-motion: reduce) {
        .row, .pulse, .fill, .installing, .installed, .pointer, .click, .sparkle, .fadeUp { animation: none; }
        .row, .fadeUp { opacity: 1; }
        .installing, .click, .sparkle { opacity: 0; }
        .installed { opacity: 1; }
      }
    ]]></style>
  </defs>

  <!-- Left: the panel in a browser window -->
  <g transform="translate(40,50)">
    <g>
      <g filter="url(#softShadow)">
        <rect width="480" height="300" rx="20" fill="var(--card)" stroke="var(--card-border)"/>
      </g>
      <g clip-path="url(#window)">
        <!-- Window bar and address -->
        <rect width="480" height="40" fill="var(--chrome)"/>
        <line x1="0" y1="40" x2="480" y2="40" stroke="var(--card-border)"/>
        <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
        <circle cx="40" cy="20" r="5" fill="#febc2e"/>
        <circle cx="58" cy="20" r="5" fill="#28c840"/>
        <rect x="84" y="9" width="300" height="22" rx="11" fill="var(--pill)" stroke="var(--card-border)"/>
        <use href="#lock" x="96" y="14"/>
        <text x="113" y="25" class="mono" font-size="12" fill="var(--text-main)">https://local.devmagic</text>

        <!-- Menu -->
        <rect x="0" y="40" width="112" height="260" fill="var(--side)"/>
        <line x1="112" y1="40" x2="112" y2="300" stroke="var(--card-border)"/>
        <rect x="14" y="54" width="22" height="22" rx="6" fill="url(#brand)"/>
        <text x="19" y="70" font-size="12" font-weight="700" fill="#ffffff">D.</text>
        <text x="42" y="70" font-size="12" font-weight="700" fill="var(--text-main)">devmagic</text>
        <rect x="10" y="88" width="92" height="20" rx="6" fill="#6d5dfc" fill-opacity="0.14"/>
        <rect x="18" y="95" width="46" height="6" rx="3" fill="#6d5dfc"/>
        <rect x="18" y="121" width="56" height="6" rx="3" fill="var(--nav)"/>
        <rect x="18" y="143" width="40" height="6" rx="3" fill="var(--nav)"/>
        <rect x="18" y="165" width="62" height="6" rx="3" fill="var(--nav)"/>
        <rect x="18" y="187" width="48" height="6" rx="3" fill="var(--nav)"/>
        <rect x="18" y="209" width="54" height="6" rx="3" fill="var(--nav)"/>

        <!-- Sites -->
        <text x="128" y="72" font-size="16" font-weight="700" fill="var(--text-main)">Sites</text>
        <rect x="370" y="56" width="94" height="26" rx="8" fill="url(#brand)"/>
        <text x="384" y="73" font-size="12" font-weight="600" fill="#ffffff">+ New site</text>

        <g class="row">
          <rect x="128" y="96" width="336" height="48" rx="10" fill="var(--row)" stroke="var(--card-border)"/>
          <circle cx="146" cy="113" r="4.5" fill="#22c55e" class="pulse"/>
          <text x="158" y="117" class="mono" font-size="12.5" fill="var(--text-main)">local.acme.com</text>
          <text x="158" y="134" font-size="10.5" fill="var(--text-sub)">WordPress 7.1 · shared core · main</text>
          <use href="#lock" x="420" y="107"/>
          <text x="434" y="117" font-size="10" font-weight="600" fill="#22a55e">SSL</text>
        </g>
        <g class="row row2">
          <rect x="128" y="154" width="336" height="48" rx="10" fill="var(--row)" stroke="var(--card-border)"/>
          <circle cx="146" cy="171" r="4.5" fill="#22c55e" class="pulse"/>
          <text x="158" y="175" class="mono" font-size="12.5" fill="var(--text-main)">local.shop.test</text>
          <text x="158" y="192" font-size="10.5" fill="var(--text-sub)">Multisite · 3 domains · Local mode</text>
          <use href="#lock" x="420" y="165"/>
          <text x="434" y="175" font-size="10" font-weight="600" fill="#22a55e">SSL</text>
        </g>
        <g class="row row3">
          <rect x="128" y="212" width="336" height="48" rx="10" fill="var(--row)" stroke="var(--card-border)"/>
          <circle cx="146" cy="229" r="4.5" fill="#f59e0b" class="pulse installing"/>
          <circle cx="146" cy="229" r="4.5" fill="#22c55e" class="installed"/>
          <text x="158" y="233" class="mono" font-size="12.5" fill="var(--text-main)">local.blog.test</text>
          <g class="installing">
            <rect x="158" y="243" width="220" height="6" rx="3" fill="var(--track)"/>
            <rect x="158" y="243" width="220" height="6" rx="3" fill="url(#bar)" class="fill"/>
            <text x="388" y="250" font-size="10" fill="var(--text-sub)">installing</text>
          </g>
          <g class="installed">
            <text x="158" y="250" font-size="10.5" fill="var(--text-sub)">From a repo · dump imported</text>
            <use href="#lock" x="420" y="223"/>
            <text x="434" y="233" font-size="10" font-weight="600" fill="#22a55e">SSL</text>
          </g>
        </g>

        <!-- Pointer and its click -->
        <g class="pointer">
          <circle cx="4" cy="4" r="14" fill="none" stroke="#6d5dfc" stroke-width="2" class="click"/>
          <path d="M0 0 L0 17 L4.5 13 L7.5 20 L10.5 18.6 L7.5 12 L13 12 Z" fill="#14123a" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(560,138)" filter="url(#textShadow)">
    <text x="0" y="0" font-size="56" font-weight="700" fill="var(--text-main)" class="fadeUp">DevMagic Panel</text>
  </g>

  <!-- Feature badges -->
  <g transform="translate(560,166)" filter="url(#softShadow)">
    <rect x="0" y="0" width="128" height="36" rx="9" class="badge-bg"/>
    <text x="14" y="24" class="badge">🔒 Local SSL</text>

    <rect x="140" y="0" width="172" height="36" rx="9" class="badge-bg"/>
    <text x="154" y="24" class="badge">⚙️ Apache &amp; hosts</text>

    <rect x="324" y="0" width="196" height="36" rx="9" class="badge-bg"/>
    <text x="338" y="24" class="badge">🧩 WordPress installs</text>

    <rect x="0" y="48" width="150" height="36" rx="9" class="badge-bg"/>
    <text x="14" y="72" class="badge">🌗 Light &amp; dark</text>

    <rect x="162" y="48" width="172" height="36" rx="9" class="badge-bg"/>
    <text x="176" y="72" class="badge">↩️ Undo &amp; archive</text>

    <rect x="346" y="48" width="150" height="36" rx="9" class="badge-bg"/>
    <text x="360" y="72" class="badge">🤖 Claude-ready</text>
  </g>

  <!-- Description -->
  <g transform="translate(560,300)">
    <text x="0" y="0" font-size="19" fill="var(--text-sub)" class="fadeUp" style="animation-delay:0.3s">Local WordPress control panel in your browser</text>
    <text x="0" y="28" font-size="15.5" fill="var(--text-sub)" class="fadeUp" style="animation-delay:0.5s">Sites, certificates, vhosts, hosts and databases on Ubuntu and Debian.</text>
  </g>

  <!-- Sparkles: positioned by their group, so the animation never moves them -->
  <g transform="translate(150,36)"><use href="#spark" fill="#ffd86b" class="sparkle" style="animation-delay:0.2s"/></g>
  <g transform="translate(470,30)"><use href="#spark" fill="#c9bfff" class="sparkle" style="animation-delay:0.9s"/></g>
  <g transform="translate(536,372)"><use href="#spark" fill="#a3ffbf" class="sparkle" style="animation-delay:1.5s"/></g>
  <g transform="translate(640,60)"><use href="#spark" fill="#ffd86b" class="sparkle" style="animation-delay:2.1s"/></g>
  <g transform="translate(860,48)"><use href="#spark" fill="#c9bfff" class="sparkle" style="animation-delay:2.7s"/></g>
  <g transform="translate(1110,92)"><use href="#spark" fill="#a3ffbf" class="sparkle" style="animation-delay:3.1s"/></g>
  <g transform="translate(1120,250)"><use href="#spark" fill="#ffd86b" class="sparkle" style="animation-delay:3.5s"/></g>
  <g transform="translate(1000,362)"><use href="#spark" fill="#c9bfff" class="sparkle" style="animation-delay:1.2s"/></g>
  <g transform="translate(20,330)"><use href="#spark" fill="#a3ffbf" class="sparkle" style="animation-delay:2.4s"/></g>
</svg>
