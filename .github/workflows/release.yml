name: release

# A tag like v0.7.0 builds the release package, after the same checks as the
# test workflow, and publishes it twice: as a GitHub release, its changelog
# section as the notes, and as the package tag pkg/v0.7.0 for git. The panel
# and get.sh read either, through whichever way can reach the repository.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag is the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Release notes from the changelog
        run: |
          awk -v head="### $GITHUB_REF_NAME" 'index($0, head) == 1 { on = 1; next } /^### v/ { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:scripts
      - run: npm run test:scripts
      - run: npm run build

      - name: Pack the release
        run: npm run package -- --out "$RUNNER_TEMP/out" --name "$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          base="devmagic-panel-$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "$out/$base.tar.gz" "$out/$base.tar.gz.sha256" "$out/$base.json" get.sh

      # The same files on a commit with no history, as the annotated tag
      # pkg/vX.Y.Z (its message the notes) and the pkg/latest branch, for
      # installs and updates over git when the repository is private. The
      # last five package tags stay, so the repository does not keep growing.
      - name: Publish the package tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          out="$RUNNER_TEMP/out"
          base="devmagic-panel-$GITHUB_REF_NAME"
          entry() { printf '%s blob %s\t%s\n' "$1" "$(git hash-object -w "$2")" "$(basename "$2")"; }
          tree="$( { entry 100644 "$out/$base.tar.gz"; entry 100644 "$out/$base.tar.gz.sha256"; entry 100644 "$out/$base.json"; entry 100755 get.sh; } | git mktree )"
          commit="$(git commit-tree "$tree" -m "$GITHUB_REF_NAME package")"
          git tag -a "pkg/$GITHUB_REF_NAME" -F "$RUNNER_TEMP/notes.md" "$commit"
          git push origin "refs/tags/pkg/$GITHUB_REF_NAME" "+$commit:refs/heads/pkg/latest"
          git ls-remote --tags --refs origin 'refs/tags/pkg/v*' | sed -E 's#^.*refs/tags/##' | sort -V | head -n -5 | while read -r old; do
            git push origin --delete "refs/tags/$old"
          done

  # The Windows setup of the release, built from its own package and attached to it
  # with its .sha256: the first install on Windows, and what the panel's helper
  # downloads and checks for "Update the Windows part".
  windows-setup:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: The helper updates from this repository
        shell: pwsh
        run: |
          $repo = (Select-String -Path windows\dmp-win.ps1 -Pattern "^\`$script:DmpRepo = '([^']+)'").Matches.Groups[1].Value
          if ($repo -ne $env:GITHUB_REPOSITORY) { "::warning::windows/dmp-win.ps1 updates from $repo, not $($env:GITHUB_REPOSITORY): change `$script:DmpRepo there in a fork" }
      - name: The release package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern "devmagic-panel-$($env:GITHUB_REF_NAME).tar.gz" --dir "$env:RUNNER_TEMP\package"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the setup and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $name = $env:GITHUB_REF_NAME
          $version = $name.TrimStart('v')
          $file = ($version -replace '-.*$', '') + '.0'
          $package = Join-Path $env:RUNNER_TEMP "package\devmagic-panel-$name.tar.gz"
          $output = & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DFileVersion=$file" "/DReleaseFile=$package" "/O$env:RUNNER_TEMP\setup" windows\installer\devmagic-panel.iss 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { "$_" }
          if ($code -ne 0) {
            $output | ForEach-Object { "$_" } | Where-Object { $_ -match 'Error|error|Line \d+' } | Select-Object -First 5 | ForEach-Object { "::error file=windows/installer/devmagic-panel.iss::$_" }
            throw "ISCC failed with $code"
          }
          $exe = Join-Path $env:RUNNER_TEMP "setup\devmagic-panel-setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$exe.sha256", "$hash  devmagic-panel-setup-$version.exe`n")
          gh release upload $name $exe "$exe.sha256" --repo $env:GITHUB_REPOSITORY

  # Once the release is out, the site rebuilds with it.
  site:
    needs: release
    uses: ./.github/workflows/site.yml
    secrets: inherit
