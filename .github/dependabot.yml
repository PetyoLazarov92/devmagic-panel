# Dependency updates. Minor and patch bumps arrive as one grouped PR per
# ecosystem, majors as a second grouped PR, both monthly, so the queue stays
# short. Majors that must track a deliberate choice are ignored:
# @types/node follows the runtime (Node 22), TypeScript majors are adopted on
# purpose.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
